name: M1A tests
on:
  push:
    paths:
      - 'bitvavo_m1a/**'
      - '.github/workflows/m1a-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile bitvavo_m1a/freeze.py bitvavo_m1a/analyze.py bitvavo_event_m0/collect_event_m0.py
      - run: python bitvavo_m1a/test_freeze.py\n      - run: python bitvavo_m1a/test_m1a.py
