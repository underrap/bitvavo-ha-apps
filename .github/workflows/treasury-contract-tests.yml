name: Treasury USDC safety contract
on:
  push:
    paths:
      - 'treasury_contract/**'
      - '.github/workflows/treasury-contract-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile treasury_contract/treasury.py treasury_contract/test_treasury.py
      - run: python treasury_contract/test_treasury.py
