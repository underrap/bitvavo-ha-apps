name: Execution safety contract
on:
  push:
    paths:
      - 'execution_contract/**'
      - '.github/workflows/execution-contract-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile execution_contract/contract.py execution_contract/test_contract.py
      - run: python execution_contract/test_contract.py
