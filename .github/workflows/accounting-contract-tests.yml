name: Accounting safety contract
on:
  push:
    paths:
      - 'accounting_contract/**'
      - '.github/workflows/accounting-contract-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile accounting_contract/accounting.py accounting_contract/test_accounting.py
      - run: python accounting_contract/test_accounting.py
