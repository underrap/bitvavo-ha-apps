name: F0 execution-topology tests
on:
  push:
    paths:
      - 'bitvavo_microstructure/analyze_f0.py'
      - 'bitvavo_microstructure/test_f0.py'
      - '.github/workflows/f0-tests.yml'
      - 'bitvavo_microstructure/EXECUTION_LOCK_WEEK1.md'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile bitvavo_microstructure/analyze_f0.py
      - run: python bitvavo_microstructure/test_f0.py
